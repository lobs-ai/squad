services:
  # The whole Squad stack in one container: WebSocket + HTTP server, agent loop,
  # plugin host, dashboard static assets, SQLite storage, and the Discord channel
  # running in-process. One image, one mention of the bot, done.
  #
  # All host-side state (config.json, .env, sqlite, uploads) lives under ./docker
  # and is bind-mounted at /app/docker. Run `pnpm setup` to generate it.
  #
  # To isolate Discord in a separate process (recommended if you run multiple
  # channels or want a crash in the bot to not restart the gateway), see
  # examples/compose.split-channels.yml.
  squad:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${SQUAD_PORT:-8080}:${SQUAD_PORT:-8080}" # HTTP + WebSocket + dashboard
    env_file:
      - ./docker/.env
    environment:
      - SQUAD_CONFIG=/app/docker/config.json
      # Local search, no API keys. Container-to-container hostname.
      - SEARXNG_URL=http://searxng:8080
    volumes:
      - ./docker:/app/docker
      - ./extensions:/app/extensions:ro
    depends_on:
      searxng:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:${SQUAD_PORT:-8080}/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # Local SearXNG instance powering the web_search tool. Aggregates many
  # public engines, no CAPTCHA or API keys. Port 8888 mapped to the host so
  # local-mode gateways (`pnpm start:local`) can hit it too.
  #
  # Settings live at ./docker/searxng/settings.yml. `pnpm setup` seeds a
  # minimal file if the folder is empty; mount it ro so the container can't
  # rewrite user config on exit.
  searxng:
    image: searxng/searxng:latest
    ports:
      - "${SEARXNG_PORT:-8888}:8080"
    environment:
      - BASE_URL=http://localhost:${SEARXNG_PORT:-8888}/
      - INSTANCE_NAME=squad-searxng
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O- http://localhost:8080/search?q=ping&format=json >/dev/null 2>&1 || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

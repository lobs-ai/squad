services:
  # The whole Squad stack in one container: WebSocket + HTTP server, agent loop,
  # plugin host, dashboard static assets, SQLite storage, and the Discord channel
  # running in-process. One image, one mention of the bot, done.
  #
  # To isolate Discord in a separate process (recommended if you run multiple
  # channels or want a crash in the bot to not restart the gateway), see
  # examples/compose.split-channels.yml.
  squad:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"            # HTTP + WebSocket + dashboard
    environment:
      - SQUAD_CONFIG=/app/config.yaml
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SQUAD_DASHBOARD_TOKEN=${SQUAD_DASHBOARD_TOKEN:-dev-dashboard-token}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./extensions:/app/extensions:ro
      - squad-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  squad-data:

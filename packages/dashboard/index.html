<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <title>squad / dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      try {
        const t = localStorage.getItem("squad-theme");
        if (t) document.documentElement.dataset.theme = t;
        const d = localStorage.getItem("squad-density");
        if (d) document.documentElement.dataset.density = d;
        const a = localStorage.getItem("squad-accent");
        if (a) {
          document.documentElement.style.setProperty("--accent", a);
          document.documentElement.style.setProperty("--accent-soft", a + "22");
          document.documentElement.style.setProperty("--accent-line", a + "55");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

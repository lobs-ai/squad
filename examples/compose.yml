services:
  squad:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../docker/.env
    environment:
      - SQUAD_CONFIG=/app/docker/config.json
    volumes:
      - ../docker:/app/docker
      - ../extensions:/app/extensions:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

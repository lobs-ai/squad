# Opt-in: run the Discord channel in its own container so a bot crash
# doesn't restart the gateway. The default compose.yml runs Discord
# in-process as a plugin; this file is only needed when you want
# isolation or run multiple channels.
#
# Both services share the host-side ./docker folder for config + state.

services:
  gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ../docker/.env
    environment:
      - SQUAD_CONFIG=/app/docker/config.json
    volumes:
      - ../docker:/app/docker
      - ../extensions:/app/extensions:ro
    restart: unless-stopped

  discord:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["pnpm", "--filter", "@squad/channel-discord", "start"]
    env_file:
      - ../docker/.env
    environment:
      - SQUAD_DISCORD_CONFIG=/app/docker/discord.json
    volumes:
      - ../docker:/app/docker
    depends_on:
      - gateway
    restart: unless-stopped
